<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Runeshape overlay (POC)</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #1e1e1e; color: #ddd; }
    #bar { padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
    button { background: #2d6a3e; color: #fff; border: 0; padding: 7px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; }
    button:disabled { opacity: .55; cursor: default; }
    #meta { font-size: 12px; color: #7fb4ff; }
    #stage { position: relative; display: inline-block; margin: 8px 12px; }
    #fixture { display: block; max-width: 100%; image-rendering: pixelated; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    .row-box { position: absolute; left: 0; right: 0; border: 2px solid #5fd1ff; background: rgba(95, 209, 255, .08); box-sizing: border-box; }
    .row-label { position: absolute; right: 4px; top: 2px; font-size: 11px; background: rgba(0, 0, 0, .65); padding: 1px 6px; border-radius: 3px; color: #5fd1ff; }
    .row-box.partial { border-color: #ffb455; background: rgba(255, 180, 85, .08); }
    .row-box.partial .row-label { color: #ffb455; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="pick">Pick fixture PNG</button>
    <span id="meta">Core (C#) via sidecar &mdash; pick a runeshape capture to detect rows.</span>
  </div>
  <div id="stage">
    <img id="fixture" alt="fixture" />
    <div id="overlay"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
