<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Not Alone, Exile</title>
<style>
  html, body { margin: 0; padding: 18px; background: #0d0f12; color: #e8e2d2;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9pt; user-select: none; overflow: hidden; }
  .title { font-size: 14pt; font-weight: bold; color: #f2e2bc; }
  .beta { font-size: 8pt; font-weight: bold; background: #3a2a16; color: #ffcd78;
    padding: 3px 8px; border-radius: 3px; margin-left: 8px; vertical-align: middle; }
  .row { margin-top: 16px; }
  label { color: #938670; display: block; margin-bottom: 4px; }
  select { width: 100%; background: #15181d; color: #e8e2d2; border: 1px solid #2a2f37;
    padding: 4px; border-radius: 2px; }
  .checkrow { display: flex; gap: 8px; align-items: center; color: #c2b59a; }
  .checkrow input { margin: 0; }
  .checkrow span { color: #938670; font-size: 8pt; }
  #status { margin-top: 12px; color: #8b939c; min-height: 18px; }
  #status.error { color: #ff6b6b; }
  #version { margin-top: 6px; color: #535b65; font-size: 8pt; }
</style>
</head>
<body>
  <div><span class="title">Not Alone, Exile</span><span class="beta">beta</span></div>
  <div class="row"><label>League</label><select id="league"></select></div>
  <div class="row checkrow">
    <input id="priceCorpus" type="checkbox">
    <div>
      <div>Capture pricecheck corpus</div>
      <span>Deduped by rune-set hash</span>
    </div>
  </div>
  <div class="row checkrow">
    <input id="debugLayout" type="checkbox">
    <div>
      <div>Debug layout overlay</div>
      <span>Shows row bounds and centers</span>
    </div>
  </div>
  <div id="status">Starting&hellip;</div>
  <div id="version"></div>
  <script src="renderer.js"></script>
</body>
</html>
